title: JungHo Lee
description: JungHo Lee is a PhD student in Statistics at Carnegie Mellon University, studying causal inference and statistical learning.
keywords: JungHo Lee, statistics, causal inference, statistical learning, Carnegie Mellon University
url: https://jungholeestat.github.io
baseurl: ""
lang: en

markdown: kramdown
kramdown:
  input: GFM

include: ["_pages"]
exclude:
  - bin/
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - package.json
  - package-lock.json
  - node_modules/
  - vendor/
keep_files: ["CNAME", ".nojekyll"]
plugins: ["jekyll-sitemap"]
defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false
